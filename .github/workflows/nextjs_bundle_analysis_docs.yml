name: 'Next.js Bundle Analysis - Docs'

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches:
      - preview
      - prod
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @simplist/ui run build

      - name: Restore next build
        uses: actions/cache@v4
        id: restore-build-cache
        env:
          cache-name: cache-next-build-docs
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}

      - name: Build next.js app
        env:
          SKIP_BUILD_STATIC_GENERATION: true
        run: pnpm --filter @simplist/docs run build

      - name: Analyze bundle
        working-directory: apps/docs
        run: npx -p nextjs-bundle-analysis report

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-docs
          path: apps/docs/.next/analyze/__bundle_analysis.json

      - name: Download base branch bundle stats
        uses: dawidd6/action-download-artifact@v6
        if: success() && github.event.number
        continue-on-error: true
        with:
          workflow: nextjs_bundle_analysis_docs.yml
          branch: ${{ github.event.pull_request.base.ref }}
          path: apps/docs/.next/analyze/base

      - name: Compare with base branch bundle
        if: success() && github.event.number
        working-directory: apps/docs
        run: |
          if [ -d ".next/analyze/base" ]; then
            echo "Base bundle found, comparing..."
            npx -p nextjs-bundle-analysis compare
          else
            echo "No base bundle found, skipping comparison (this is normal for the first run)"
          fi

      - name: Get comment body
        id: get-comment-body
        if: success() && github.event.number
        working-directory: apps/docs
        run: |
          if [ -f ".next/analyze/__bundle_analysis_comment.txt" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$(cat .next/analyze/__bundle_analysis_comment.txt)" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        if: success() && github.event.number
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: '<!-- __NEXTJS_BUNDLE_@simplist/docs -->'

      - name: Create Comment
        uses: peter-evans/create-or-update-comment@v4
        if: success() && github.event.number && steps.fc.outputs.comment-id == '' && steps.get-comment-body.outputs.body != ''
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}

      - name: Update Comment
        uses: peter-evans/create-or-update-comment@v4
        if: success() && github.event.number && steps.fc.outputs.comment-id != '' && steps.get-comment-body.outputs.body != ''
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: ${{ steps.get-comment-body.outputs.body }}
          edit-mode: replace
